name: Build and publish Lambda release

on:
  push:
    branches: [deploy/lambda]

permissions:
  id-token: write
  contents: read

jobs:
  build-publish-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check required variables
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$ARTIFACT_BUCKET" || (echo "Set ARTIFACT_BUCKET" >&2; exit 1)
          test -n "$AWS_REGION" || (echo "Set AWS_REGION" >&2; exit 1)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambda and frontend artifacts
        run: ./deploy/lambda/build.sh

      - name: Publish versioned artifact bundle
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          RELEASE_VERSION: ${{ github.sha }}-${{ github.run_id }}
        run: |
          aws s3 cp build/deployment-bundle.tar.gz \
            "s3://${ARTIFACT_BUCKET}/releases/${RELEASE_VERSION}/deployment-bundle.tar.gz" \
            --no-progress

      - name: Trigger infra deployment
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPOSITORY: ${{ vars.INFRA_REPOSITORY }}
          RELEASE_VERSION: ${{ github.sha }}-${{ github.run_id }}
        run: |
          test -n "$INFRA_REPOSITORY" || (echo "Set INFRA_REPOSITORY to owner/repository" >&2; exit 1)
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${INFRA_REPOSITORY}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"deploy-release\",\"client_payload\":{\"release_version\":\"${RELEASE_VERSION}\"}}"
