name: Build and push Kubernetes images to ECR

on:
  push:
    branches: [deploy/kubernetes]
    tags: ['**']

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "$AWS_REGION" || (echo "Set the AWS_REGION repository variable" >&2; exit 1)
          test -n "$AWS_ROLE_TO_ASSUME" || (echo "Set the AWS_ROLE_TO_ASSUME secret" >&2; exit 1)

      - name: Verify tag belongs to deploy/kubernetes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin deploy/kubernetes
          git merge-base --is-ancestor "$GITHUB_SHA" origin/deploy/kubernetes || {
            echo "Image tags must point to a commit on deploy/kubernetes." >&2
            exit 1
          }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sar-mel-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sar-mel-frontend:latest
