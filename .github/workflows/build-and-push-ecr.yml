name: Build and push Kubernetes images to ECR

on:
  push:
    branches: [deploy/kubernetes]
    tags: ['**']

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "$AWS_REGION" || (echo "Set the AWS_REGION repository variable" >&2; exit 1)
          test -n "$AWS_ROLE_TO_ASSUME" || (echo "Set the AWS_ROLE_TO_ASSUME secret" >&2; exit 1)

      - name: Verify tag belongs to deploy/kubernetes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin deploy/kubernetes
          git merge-base --is-ancestor "$GITHUB_SHA" origin/deploy/kubernetes || {
            echo "Image tags must point to a commit on deploy/kubernetes." >&2
            exit 1
          }

      - name: Resolve image tag
        id: image-tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            image_tag="$REF_NAME"
          else
            image_tag="latest"
          fi
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Not a valid Docker image tag: $image_tag" >&2
            exit 1
          fi
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Ensure ECR repositories exist
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          for repository in sar-mel-backend sar-mel-frontend; do
            if ! aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository \
                --repository-name "$repository" \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256 >/dev/null
              echo "Created ECR repository: $repository"
            else
              echo "ECR repository exists: $repository"
            fi
          done

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sar-mel-backend:${{ steps.image-tag.outputs.value }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/sar-mel-frontend:${{ steps.image-tag.outputs.value }}
